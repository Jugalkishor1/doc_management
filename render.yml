databases:
  - name: doc_management
    databaseName: doc_management
    user: doc_management
    plan: free

services:
  - type: web
    plan: free
    name: doc_management
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doc_management
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false